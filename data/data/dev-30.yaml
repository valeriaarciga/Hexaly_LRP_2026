# Development train/test instance set — 30 COORDS instances.
#
# NOT the official competition set (that is private; SPEC §4.4). This is a
# self-generated development set matching the SPEC §4.1 size distribution
# (10 small + 10 medium + 10 large) and the §4.2 tightness / §4.3 structural
# variety, but rendered entirely as COORDS (Euclidean) — including the "large"
# tier, which here is just large-n COORDS standing in for the official
# FULL_MATRIX/ZMM tier. Add real OSRM FULL_MATRIX instances later if you need
# to exercise asymmetric / triangle-inequality-violating road distances.
#
# Generate a train/test split by running this config twice with disjoint
# --seed-base offsets into separate output dirs:
#
#   smio-clrp-generate --config configs/dev-30.yaml --out instances/train --seed-base 0
#   smio-clrp-generate --config configs/dev-30.yaml --out instances/test  --seed-base 100000
#
# Seeds live in a fresh 30000 range, disjoint from the mock (7000), sample
# (100s), zmm (9000), and demo (4000) sets.
#
# rho_*_target are tuning knobs, not achieved values: the load-balanced
# capacity sampler's per-depot integer ceilings pull achieved rho a few
# percent below target, which is why tight/asymmetric entries target the
# 0.87-0.98 band (mirrors mock-2026.yaml).

generator_version: "0.1.0"

